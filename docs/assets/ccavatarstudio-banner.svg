<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" fill="none">
  <!-- Brand Mark Group (Scaled to 92x92) -->
  <g transform="translate(14, 14) scale(1.916)">
    <!-- Studio Circular Backdrop Enclosure -->
    <circle cx="21" cy="24" r="19" fill="#FFF7ED" stroke="#FF7A30" stroke-width="2.2" />

    <!-- Head & Neck Base Fill -->
    <path d="M17 17 C21 16 28 17 29 20 C29.8 22 28.5 24 26.5 24.5 C28 25.5 28.5 27 27 29 C25 31.5 22 32 19 32 L18 39 L14 38 L15 32 Z" fill="#FFF1E6" />

    <!-- Streetwear Cap Bill / Visor pointing back -->
    <path d="M13 18 C10 18.5 6 20 5 21.5 C7 23 11 21.5 14 20 Z" fill="#FF7A30" stroke="#1E2A47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cap Crown -->
    <path d="M12 19 C12 13 17 9 23 11 C26 12 28 14 28.5 17 C24 16 17 16.5 12 19 Z" fill="#1E2A47" stroke="#1E2A47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cap Button on top -->
    <circle cx="21" cy="9.8" r="1.5" fill="#FF7A30" />

    <!-- Facial Profile Outline -->
    <path d="M28 17 C28.5 18 29.5 20.2 29.8 21.2 C30 21.8 29.4 22.4 28.7 22.4 C27.5 22.4 26.5 22.8 26.2 23.5 C25.8 24.5 27.5 26 27.2 27.5 C26.8 29.5 24.5 31 21 31.5" stroke="#1E2A47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cheerful Smiling Open Mouth -->
    <path d="M26.2 25 C27.6 25.4 27.6 27 25.8 27.2 C24.8 27.3 25.2 25.2 26.2 25 Z" fill="#FF7A30" stroke="#1E2A47" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Smiling Eye Line -->
    <path d="M24 19.5 C25 18.5 26.5 18.5 27.2 19.5" stroke="#1E2A47" stroke-width="2" stroke-linecap="round" />

    <!-- Studio Over-Ear Headphones -->
    <path d="M17 10 C18.8 8.8 21 8.5 23.5 9" stroke="#6BBFBF" stroke-width="2.8" stroke-linecap="round" />
    <rect x="15" y="18" width="7" height="11" rx="3.5" fill="#6BBFBF" stroke="#1E2A47" stroke-width="2" stroke-linejoin="round" />
    <line x1="18.5" y1="21" x2="18.5" y2="26" stroke="#1E2A47" stroke-width="1.6" stroke-linecap="round" />

    <!-- 3 Concentric Soundwave Speech Arcs -->
    <path d="M32.5 22.5 C34 24 34 26.5 32.5 28" stroke="#FF7A30" stroke-width="2.2" stroke-linecap="round" />
    <path d="M36.5 20 C39 23 39 27.5 36.5 30.5" stroke="#FF7A30" stroke-width="2.2" stroke-linecap="round" />
    <path d="M40.5 17.5 C44 21.5 44 29 40.5 33" stroke="#FF7A30" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Typography & Wordmark -->
  <g transform="translate(126, 0)">
    <!-- Title Text -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.03em">
      <tspan fill="#FF7A30">cc</tspan><tspan fill="#0F172A">avatarstudio</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#64748B" letter-spacing="0.01em">
      Cartoon AI Avatar &amp; Voiceover Video Studio
    </text>

    <!-- Pill Badge -->
    <g transform="translate(2, 92)">
      <rect width="210" height="20" rx="6" fill="#F1F5F9" />
      <circle cx="10" cy="10" r="3.5" fill="#10B981" />
      <text x="20" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#475569" letter-spacing="0.04em">
        100% FREE · OFFLINE · OPEN SOURCE
      </text>
    </g>
  </g>
</svg>
